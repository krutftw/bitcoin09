# Include only in the canonical btc09.org TLS server. Every upstream route is
# exact or anchored to the reviewed Nine Inbox namespace.
location = /inbox {
    limit_except GET HEAD { deny all; }
    limit_req zone=btc09_nine_read burst=20 nodelay;
    limit_req_status 429;
    limit_conn btc09_nine_connections 8;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/bitcoin09-security-headers.conf;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_pass http://127.0.0.1:8020;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

