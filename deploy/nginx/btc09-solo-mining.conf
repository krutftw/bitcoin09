# Load this file in nginx's http context. Replace mine.example.org and the
# certificate paths before enabling it.
limit_req_zone $binary_remote_addr zone=btc09_solo_work:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name mine.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mine.example.org;

    ssl_certificate /etc/letsencrypt/live/mine.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mine.example.org/privkey.pem;

    client_max_body_size 4k;
    client_body_timeout 10s;
    keepalive_timeout 30s;

    location /api/v1/ {
        limit_req zone=btc09_solo_work burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        proxy_send_timeout 10s;
    }

    location / {
        return 404;
    }
}
