# Load once in nginx's http context. The canonical Cloudflare real-IP rules
# must restore the client address before these zones are evaluated.
limit_req_zone $binary_remote_addr zone=btc09_nine_create:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=btc09_nine_read:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=btc09_nine_write:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=btc09_nine_connections:10m;
