# Include only inside the canonical btc09.org TLS server.
location = /api/support/v1/status {
    limit_except GET HEAD { deny all; }
    limit_req zone=btc09_support_read burst=20 nodelay;
    limit_req_status 429;
    limit_conn btc09_support_connections 8;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/bitcoin09-security-headers.conf;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:8032;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /api/support/v1/currencies {
    limit_except GET HEAD { deny all; }
    limit_req zone=btc09_support_read burst=10 nodelay;
    limit_req_status 429;
    limit_conn btc09_support_connections 4;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/bitcoin09-security-headers.conf;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:8032;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /api/support/v1/payments {
    limit_except POST { deny all; }
    limit_req zone=btc09_support_create burst=3 nodelay;
    limit_req_status 429;
    limit_conn btc09_support_connections 2;
    client_max_body_size 4k;
    client_body_timeout 10s;
    proxy_request_buffering on;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/bitcoin09-security-headers.conf;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:8032;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location ~ "^/api/support/v1/payments/[0-9]{4,32}$" {
    limit_except GET HEAD { deny all; }
    limit_req zone=btc09_support_read burst=20 nodelay;
    limit_req_status 429;
    limit_conn btc09_support_connections 4;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/bitcoin09-security-headers.conf;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:8032;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
