server {
    listen 80;
    listen [::]:80;
    server_name mine.btc09.org;
    return 301 https://mine.btc09.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mine.btc09.org;

    ssl_certificate /etc/letsencrypt/live/btc09.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/btc09.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /api/v1/work {
        limit_except POST { deny all; }
        limit_req zone=btc09_miner_work burst=4 nodelay;
        limit_conn btc09_miner_connections 4;
        client_max_body_size 4k;
        client_body_timeout 10s;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 35s;
        proxy_pass http://127.0.0.1:9010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/v1/submit {
        limit_except POST { deny all; }
        limit_req zone=btc09_miner_submit burst=2 nodelay;
        limit_conn btc09_miner_connections 4;
        client_max_body_size 4k;
        client_body_timeout 10s;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 35s;
        proxy_pass http://127.0.0.1:9010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
