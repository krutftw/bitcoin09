# Include only in the canonical btc09.org TLS server.
location = /api/wallet/v1/snapshot {
    limit_except POST { deny all; }
    limit_req zone=btc09_wallet_snapshot burst=4 nodelay;
    limit_conn btc09_wallet_connections 4;
    client_max_body_size 64k;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /api/wallet/v1/broadcast {
    limit_except POST { deny all; }
    limit_req zone=btc09_wallet_broadcast burst=2 nodelay;
    limit_conn btc09_wallet_connections 2;
    client_max_body_size 32k;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
