real_ip_header CF-Connecting-IP;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=otc_feed_rate:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=otc_feed_conn:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name btc09.org www.btc09.org 178.128.105.41 _;

    root /var/www/bitcoin09;
    index index.html;

    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /otc-bot-feed.json {
        proxy_pass http://127.0.0.1:8019/otc-bot-feed.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=otc_feed_rate burst=10 nodelay;
        limit_conn otc_feed_conn 4;
    }

}
