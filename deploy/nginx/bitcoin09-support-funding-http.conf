# Shared HTTP-scope limits for the BTC09 support service. The canonical real-IP
# configuration restores the visitor address before these zones are evaluated.
limit_req_zone $binary_remote_addr zone=btc09_support_read:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=btc09_support_create:10m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=btc09_support_connections:10m;
