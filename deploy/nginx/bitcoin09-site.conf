# Canonical public web presence. Rate-limit zones used by included service
# snippets are declared in their matching *-http.conf files under http {}.

server {
    listen 80;
    listen [::]:80;
    server_name www.btc09.org;
    return 301 https://btc09.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.btc09.org;

    ssl_certificate /etc/letsencrypt/live/btc09.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/btc09.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    return 301 https://btc09.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name btc09.org;
    return 301 https://btc09.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name btc09.org;

    root /var/www/bitcoin09;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/btc09.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/btc09.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    error_page 404 /404.html;
    location = /404.html { internal; }
    location / { try_files $uri $uri/ =404; }

    include /etc/nginx/snippets/bitcoin09-otc-server.conf;
    include /etc/nginx/snippets/bitcoin09-wallet-gateway-server.conf;
    include /etc/nginx/snippets/bitcoin09-open-miner-server.conf;
    include /etc/nginx/snippets/bitcoin09-nine-inbox-server.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name explorer.btc09.org;
    return 301 https://explorer.btc09.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name explorer.btc09.org;

    ssl_certificate /etc/letsencrypt/live/btc09.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/btc09.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location / {
        proxy_pass http://127.0.0.1:8009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
}
