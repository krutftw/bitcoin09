## Included only in the canonical btc09.org TLS server block.
location = /otc-bot-feed.json {
    proxy_pass http://127.0.0.1:8019/otc-bot-feed.json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    limit_req zone=otc_feed_rate burst=10 nodelay;
    limit_conn otc_feed_conn 4;
}
