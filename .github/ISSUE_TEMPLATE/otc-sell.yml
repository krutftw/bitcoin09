name: 09C OTC sell offer
description: Public sell offer for the Bitcoin 09 OTC board.
title: "[WTS] "
labels: ["otc-offer", "otc-sell"]
body:
  - type: markdown
    attributes:
      value: |
        Public OTC notice only. Bitcoin 09 does not custody funds, match orders, provide escrow, process payments, set an official price, or guarantee trades.

        Post only details you are comfortable making public. GitHub lets you attach redacted screenshots or files after opening the issue, but do not upload payment account details, private wallet data, or anything the other side did not agree to make public.
  - type: input
    id: amount
    attributes:
      label: 09C amount
      description: How much 09C do you want to sell?
      placeholder: "9000"
    validations:
      required: true
  - type: input
    id: total-price
    attributes:
      label: Total offer price
      description: Total amount you are asking.
      placeholder: "40 USDT"
    validations:
      required: true
  - type: dropdown
    id: payment-asset
    attributes:
      label: Payment asset
      options:
        - USDT
        - BTC
        - AUD
        - Other
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Public contact
      description: Public contact only. Discord handle is fine.
      placeholder: "Discord @name"
    validations:
      required: true
  - type: textarea
    id: terms
    attributes:
      label: Terms or notes
      description: Optional public details such as preferred settlement flow, expiry, region, redacted proof, or tx proof expectations.
      placeholder: "Trade small first. No official escrow."
    validations:
      required: false
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I understand this is a public OTC notice, not an official exchange order.
          required: true
        - label: I will not ask for seed phrases, private keys, wallet files, Discord tokens, or remote access.
          required: true
        - label: I understand Bitcoin 09 staff does not provide official escrow or trade guarantees.
          required: true
