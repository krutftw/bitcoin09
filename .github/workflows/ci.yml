name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Known vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Test wallet-only edition with race detector
        run: go test -race -tags walletedition ./desktop ./cmd/btc09
      - name: Verify wallet-only binary boundary
        run: |
          go build -trimpath -tags walletedition -o btc09-wallet-core ./cmd/btc09
          node tools/desktop/verify-wallet-edition.mjs btc09-wallet-core

  project-contracts:
    name: Product contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Install bot dependencies
        run: python -m pip install -r bot/requirements.txt
      - name: Discord contracts
        run: node --test tools/discord/*.test.mjs
      - name: Nine Inbox contracts
        run: node --test nineinbox/web/*.test.mjs
      - name: Native wallet contracts
        run: node --test tools/desktop/*.test.mjs tools/desktop/*.test.cjs
      - name: Discord bot tests
        run: python -m unittest discover -s bot/tests -p 'test_*.py'
      - name: Website and deployment contracts
        run: |
          python -m unittest \
            tools.release.test_direct_distribution \
            tools.release.test_package_macos \
            tools.release.test_package_windows_store \
            tools.site.test_index_contract \
            tools.site.test_store_readiness_contract \
            tools.deploy.test_nine_inbox_contract \
            tools.deploy.test_open_miner_contract \
            tools.deploy.test_web_presence_contract \
            tools.exchange.test_btc09_exchange_smoke \
            tools.ci.test_ci_workflow_contract

  mobile-wallet:
    name: Mobile wallet contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: walletapp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: walletapp/plugins/tauri-plugin-wallet-core -> target
      - name: Install mobile wallet dependencies
        working-directory: walletapp
        run: npm ci
      - name: Mobile product and security contracts
        run: node --test tools/mobile/*.test.mjs
      - name: Generate-check Android and iPhone bindings
        run: npm --prefix walletapp run mobile:check
      - name: Check mobile plugin
        run: |
          cargo fmt --manifest-path walletapp/plugins/tauri-plugin-wallet-core/Cargo.toml -- --check
          cargo check --manifest-path walletapp/plugins/tauri-plugin-wallet-core/Cargo.toml
      - name: Install browser for the phone-sized visual flow
        working-directory: walletapp
        run: npx playwright install --with-deps chromium
      - name: Run phone-sized visual and interaction flow
        run: npm --prefix walletapp run mobile:ui-smoke
      - name: Install the pinned Android build toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          rustup target add aarch64-linux-android
          chmod +x walletapp/src-tauri/gen/android/gradlew
      - name: Build release-shaped Android packages
        working-directory: walletapp
        run: npm run mobile:android:build
      - name: Inspect Android package protections
        run: |
          apk="walletapp/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          aab="walletapp/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab"
          manifest="walletapp/src-tauri/gen/android/app/build/intermediates/merged_manifests/universalRelease/processUniversalReleaseManifest/AndroidManifest.xml"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
          test -s "$apk"
          test -s "$aab"
          jarsigner -verify -verbose "$aab" 2>&1 | tee /tmp/btc09-aab-signature.txt
          grep -q 'jar is unsigned' /tmp/btc09-aab-signature.txt
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' "$manifest"
          grep -q 'android.permission.CAMERA' "$manifest"
          if grep -q 'android.permission.VIBRATE' "$manifest"; then
            echo 'Unexpected vibration permission in Android wallet manifest' >&2
            exit 1
          fi
          flat_manifest="$(tr -d '\n\r' < "$manifest")"
          grep -q 'android.hardware.camera.any"[[:space:]]*android:required="false"' <<< "$flat_manifest"
          grep -q 'android.hardware.camera"[[:space:]]*android:required="false"' <<< "$flat_manifest"
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk")"
          grep -q "native-code: 'arm64-v8a'" <<< "$badging"
          apk_listing="$(unzip -l "$apk")"
          if grep -Eiq 'miner|sidecar|btc09-core' <<< "$apk_listing"; then
            echo 'Desktop or mining payload found in Android APK' >&2
            exit 1
          fi
          aab_listing="$(unzip -l "$aab")"
          grep -q 'base/lib/arm64-v8a/libbtc09_wallet_lib.so' <<< "$aab_listing"
          if grep -Eiq 'base/lib/(x86|armeabi)|miner|sidecar|btc09-core' <<< "$aab_listing"; then
            echo 'Unexpected ABI, desktop, or mining payload found in Android AAB' >&2
            exit 1
          fi
          if grep -q 'android:debuggable="true"' "$manifest"; then
            echo 'Release Android wallet is debuggable' >&2
            exit 1
          fi

  ios-wallet:
    name: iPhone wallet simulator
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: walletapp/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: walletapp/src-tauri -> target
      - name: Install iPhone wallet dependencies
        working-directory: walletapp
        run: npm ci
      - name: Build shared iPhone wallet core
        run: npm --prefix walletapp run mobile:core:ios
      - name: Initialize disposable iPhone host
        working-directory: walletapp
        run: npm run tauri -- ios init --ci --skip-targets-install
      - name: Compile iPhone wallet and Swift bridge
        working-directory: walletapp
        run: npm run mobile:ios:simulator

  native-wallet:
    name: Native wallet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-14
          - ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: walletapp/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: walletapp/src-tauri -> target
      - name: Install native wallet dependencies
        working-directory: walletapp
        run: npm ci
      - name: Prepare wallet core for native shell tests
        run: node tools/desktop/prepare-sidecar.mjs wallet
      - name: Check Rust formatting
        run: cargo fmt --manifest-path walletapp/src-tauri/Cargo.toml -- --check
      - name: Test native shell
        run: cargo test --manifest-path walletapp/src-tauri/Cargo.toml
      - name: Compile native wallet
        working-directory: walletapp
        run: npm run desktop:build -- --no-bundle
      - name: Compile wallet-only edition
        working-directory: walletapp
        run: npm run store:build -- --no-bundle
      - name: Build unsigned Microsoft Store package
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./tools/release/package_windows_store.ps1
          -IdentityName 'BTC09.Test.Wallet'
          -Publisher 'CN=BTC09 Test Publisher'
          -PublisherDisplayName 'Bitcoin 09'
          -OutputPath 'walletapp/src-tauri/target/store/btc09-wallet-store.msix'
          -SkipBuild
