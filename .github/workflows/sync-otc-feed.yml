name: Sync OTC bot feed

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-otc-feed
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sanitized OTC feed
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          curl -fsSL --max-time 20 "http://82.22.32.82:8019/otc-bot-feed.json" -o "$tmp"
          python -m json.tool "$tmp" > docs/otc-bot-feed.json

      - name: Commit feed if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/otc-bot-feed.json; then
            echo "No OTC feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/otc-bot-feed.json
          git commit -m "Sync OTC bot feed"
          git push
