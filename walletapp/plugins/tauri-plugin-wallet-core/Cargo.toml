[package]
name = "tauri-plugin-wallet-core"
version = "0.1.0"
authors = [ "Bitcoin 09 contributors" ]
description = "Native Android and iPhone bridge for BTC09 Wallet"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-wallet-core"

[dependencies]
tauri = { version = "2.11.5" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
