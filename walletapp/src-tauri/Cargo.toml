[package]
name = "btc09-wallet"
version = "0.1.33"
description = "Native BTC09 wallet"
authors = ["Bitcoin 09 contributors"]
edition = "2021"
license = "MIT"
rust-version = "1.77.2"

[features]
default = []
wallet-only = []

[lib]
name = "btc09_wallet_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
url = "2.5.8"
