stages:
  - test
  - package

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true

variables:
  GIT_DEPTH: "0"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

.go-cache:
  image: golang:1.25.12-bookworm
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-mod
      - .cache/go-build
  before_script:
    - mkdir -p "$GOMODCACHE" "$GOCACHE"

go-quality:
  extends: .go-cache
  timeout: 20m
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
    - govulncheck ./...
    - go vet ./...
    - go test -race ./...

wallet-edition:
  extends: .go-cache
  timeout: 15m
  before_script:
    - !reference [.go-cache, before_script]
    - apt-get update
    - apt-get install -y --no-install-recommends nodejs
    - rm -rf /var/lib/apt/lists/*
  script:
    - go test -tags walletedition ./desktop ./cmd/btc09
    - go build -trimpath -tags walletedition -o btc09-wallet-core ./cmd/btc09
    - node tools/desktop/verify-wallet-edition.mjs btc09-wallet-core

javascript-contracts:
  image: node:24-bookworm
  timeout: 10m
  script:
    - npm --prefix walletapp audit --omit=dev --audit-level=high
    - node --test tools/discord/*.test.mjs
    - node --test nineinbox/web/*.test.mjs
    - node --test tools/desktop/*.test.mjs tools/desktop/*.test.cjs
    - node --test tools/mobile/*.test.mjs

python-contracts:
  image: python:3.13-bookworm
  timeout: 15m
  cache:
    key:
      files:
        - bot/requirements.txt
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends shellcheck
    - rm -rf /var/lib/apt/lists/*
    - python -m pip install --disable-pip-version-check -r bot/requirements.txt
    - python -m pip install --disable-pip-version-check pip-audit==2.10.0
  script:
    - pip-audit -r bot/requirements.txt
    - python -m unittest discover -s bot/tests -p 'test_*.py'
    - >-
      python -m unittest
      tools.release.test_package_macos
      tools.release.test_direct_distribution
      tools.release.test_package_windows_store
      tools.site.test_index_contract
      tools.site.test_store_readiness_contract
      tools.deploy.test_nine_inbox_contract
      tools.deploy.test_open_miner_contract
      tools.deploy.test_web_presence_contract
      tools.exchange.test_btc09_exchange_smoke
      tools.ci.test_ci_workflow_contract

package-linux-appimage:
  stage: package
  image: rust:1.95.0-bookworm
  timeout: 45m
  interruptible: false
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_COMMIT_TAG
      when: manual
    - when: never
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl xz-utils libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
    - rm -rf /var/lib/apt/lists/*
    - curl --fail --location --silent --show-error https://go.dev/dl/go1.25.12.linux-amd64.tar.gz -o /tmp/go.tgz
    - echo "234828b7a89e0e303d2556310ee549fbcf253d28de937bac3da13d6294262ac1  /tmp/go.tgz" | sha256sum -c -
    - mkdir -p /opt/go1.25.12 && tar -C /opt/go1.25.12 --strip-components=1 -xzf /tmp/go.tgz
    - curl --fail --location --silent --show-error https://nodejs.org/dist/v24.11.1/node-v24.11.1-linux-x64.tar.xz -o /tmp/node.tar.xz
    - echo "60e3b0a8500819514aca603487c254298cd776de0698d3cd08f11dba5b8289a8  /tmp/node.tar.xz" | sha256sum -c -
    - mkdir -p /opt/node24 && tar -C /opt/node24 --strip-components=1 -xf /tmp/node.tar.xz
    - 'export PATH="/opt/go1.25.12/bin:/opt/node24/bin:$PATH"'
    - go version && node --version && rustc --version
    - npm --prefix walletapp ci
  script:
    - 'export PATH="/opt/go1.25.12/bin:/opt/node24/bin:$PATH"'
    - npm --prefix walletapp run store:build -- --bundles appimage
    - node tools/desktop/verify-wallet-edition.mjs walletapp/src-tauri/target/release/btc09-core
    - mkdir -p walletapp/src-tauri/target/direct
    - appimage="$(find walletapp/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
    - test -n "$appimage" && test -s "$appimage"
    - cp "$appimage" walletapp/src-tauri/target/direct/btc09-wallet-linux-x64.AppImage
    - cd walletapp/src-tauri/target/direct && sha256sum btc09-wallet-linux-x64.AppImage > SHA256SUMS
  artifacts:
    name: "btc09-wallet-linux-$CI_COMMIT_REF_SLUG"
    expire_in: 7 days
    paths:
      - walletapp/src-tauri/target/direct/btc09-wallet-linux-x64.AppImage
      - walletapp/src-tauri/target/direct/SHA256SUMS

package-android-apk:
  stage: package
  image: ghcr.io/cirruslabs/android-sdk:36
  timeout: 60m
  interruptible: false
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_COMMIT_TAG
      when: manual
    - when: never
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl xz-utils build-essential pkg-config libssl-dev
    - rm -rf /var/lib/apt/lists/*
    - curl --fail --location --silent --show-error https://go.dev/dl/go1.25.12.linux-amd64.tar.gz -o /tmp/go.tgz
    - echo "234828b7a89e0e303d2556310ee549fbcf253d28de937bac3da13d6294262ac1  /tmp/go.tgz" | sha256sum -c -
    - mkdir -p /opt/go1.25.12 && tar -C /opt/go1.25.12 --strip-components=1 -xzf /tmp/go.tgz
    - curl --fail --location --silent --show-error https://nodejs.org/dist/v24.11.1/node-v24.11.1-linux-x64.tar.xz -o /tmp/node.tar.xz
    - echo "60e3b0a8500819514aca603487c254298cd776de0698d3cd08f11dba5b8289a8  /tmp/node.tar.xz" | sha256sum -c -
    - mkdir -p /opt/node24 && tar -C /opt/node24 --strip-components=1 -xf /tmp/node.tar.xz
    - curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs -o /tmp/rustup-init.sh
    - sh /tmp/rustup-init.sh -y --profile minimal
    - 'export PATH="/opt/go1.25.12/bin:/opt/node24/bin:$HOME/.cargo/bin:$PATH"'
    - rustup target add aarch64-linux-android
    - yes | sdkmanager --licenses >/dev/null || true
    - sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
    - npm --prefix walletapp ci
  script:
    - 'export PATH="/opt/go1.25.12/bin:/opt/node24/bin:$HOME/.cargo/bin:$PATH"'
    - test -n "$BTC09_ANDROID_KEYSTORE_B64"
    - test -n "$BTC09_ANDROID_KEYSTORE_PASSWORD"
    - test -n "$BTC09_ANDROID_KEY_ALIAS"
    - test -n "$BTC09_ANDROID_KEY_PASSWORD"
    - umask 077 && mkdir -p "$CI_PROJECT_DIR/.release-secrets"
    - printf '%s' "$BTC09_ANDROID_KEYSTORE_B64" | base64 --decode > "$CI_PROJECT_DIR/.release-secrets/btc09-release.jks"
    - export BTC09_ANDROID_KEYSTORE="$CI_PROJECT_DIR/.release-secrets/btc09-release.jks"
    - npm --prefix walletapp run tauri -- android build --apk --target aarch64 --ci
    - apk="walletapp/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
    - test -s "$apk"
    - export BTC09_REQUIRE_ANDROID_SIGNATURE=1
    - node tools/mobile/verify-artifact.mjs "$apk"
    - mkdir -p walletapp/src-tauri/target/direct
    - cp "$apk" walletapp/src-tauri/target/direct/btc09-wallet-android-arm64.apk
    - >-
      "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" |
      sed -n 's/^Signer #1 certificate SHA-256 digest:[[:space:]]*//p'
      > walletapp/src-tauri/target/direct/ANDROID-CERT-SHA256.txt
    - test -s walletapp/src-tauri/target/direct/ANDROID-CERT-SHA256.txt
    - cd walletapp/src-tauri/target/direct && sha256sum btc09-wallet-android-arm64.apk > SHA256SUMS
  after_script:
    - rm -f "$CI_PROJECT_DIR/.release-secrets/btc09-release.jks"
  artifacts:
    name: "btc09-wallet-android-$CI_COMMIT_REF_SLUG"
    expire_in: 7 days
    paths:
      - walletapp/src-tauri/target/direct/btc09-wallet-android-arm64.apk
      - walletapp/src-tauri/target/direct/ANDROID-CERT-SHA256.txt
      - walletapp/src-tauri/target/direct/SHA256SUMS
